name: Update antiestafas feed

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install -r requirements.txt

      - name: Build latest.json
        run: |
          python scripts/scripts/build_feed.py

      - name: Commit and push if changed
        run: |
          git config user.name "antiestafas-bot"
          git config user.email "antiestafas-bot@users.noreply.github.com"
          git add latest.json
          git diff --cached --quiet || git commit -m "update latest.json"
          git push
